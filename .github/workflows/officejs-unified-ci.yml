name: Office.js unified CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/officejs-unified-ci.yml"
      - ".github/workflows/officejs-signed-candidate.yml"
      - "officejs/**"
      - "packaging/**"
      - "src/WordOllama.Contracts/**"
      - "src/WordOllama.Core/**"
      - "src/WordOllama.DesktopBridge/**"
      - "src/WordOllama.Mcp/**"
      - "src/WordOllama.Platform/**"
      - "src/WordOllama.WindowsInstaller/**"
      - "tools/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/officejs-unified-ci.yml"
      - ".github/workflows/officejs-signed-candidate.yml"
      - "officejs/**"
      - "packaging/**"
      - "src/WordOllama.Contracts/**"
      - "src/WordOllama.Core/**"
      - "src/WordOllama.DesktopBridge/**"
      - "src/WordOllama.Mcp/**"
      - "src/WordOllama.Platform/**"
      - "src/WordOllama.WindowsInstaller/**"
      - "tools/**"

permissions:
  contents: read

jobs:
  target-package:
    name: Package ${{ matrix.runtime }} on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            runtime: win-x64
          - runner: macos-15
            runtime: osx-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: officejs/apps/addin/package-lock.json
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Install Office.js dependencies
        working-directory: officejs/apps/addin
        run: npm ci
      - name: Build unsigned unified artifacts
        shell: pwsh
        run: >
          ./packaging/package-unified-release.ps1
          -Runtime ${{ matrix.runtime }}
          -Configuration Release
          -Version test-ci-${{ github.run_number }}-${{ github.run_attempt }}
          -ManifestVersion 1.2.${{ github.run_number }}.${{ github.run_attempt }}
          -BaseUrl https://localhost:37421
          -BridgeUrl https://localhost:37421
          -UpdateIndexUrl https://updates.wordollama.invalid/ci-${{ github.run_number }}-${{ github.run_attempt }}/index.json
          -ExpectedUpdatePublisherSubject 'CN=WordOllama CI Unsigned Test'
          -OutputRoot ./ci-unified
      - name: Build WPS add-in package
        if: ${{ matrix.runtime == 'win-x64' }}
        shell: pwsh
        run: ./packaging/package-wps-addin.ps1 -OutputDirectory ./ci-unified/wps -SkipBuild
      - name: Build target-native test installer
        shell: pwsh
        run: |
          $version = 'test-ci-${{ github.run_number }}-${{ github.run_attempt }}'
          if ('${{ matrix.runtime }}' -eq 'win-x64') {
            ./packaging/package-windows-installer.ps1 `
              -ArtifactRoot ./ci-unified/bridge `
              -Version $version `
              -BuildUnsignedForTests
          } else {
            ./packaging/package-macos-installer.ps1 `
              -Runtime osx-arm64 `
              -ArtifactRoot ./ci-unified/bridge `
              -Version $version `
              -BuildUnsignedForTests
          }
      - name: Upload unsigned build evidence
        uses: actions/upload-artifact@v7
        with:
          name: wordollama-js-${{ matrix.runtime }}-unsigned
          path: |
            ci-unified/
            !ci-unified/wps/
          if-no-files-found: error
          retention-days: 7
      - name: Upload WPS add-in package
        if: ${{ matrix.runtime == 'win-x64' }}
        uses: actions/upload-artifact@v7
        with:
          name: wordollama-js-wps-unsigned
          path: ci-unified/wps/WordOllama.JS-WPS.zip
          if-no-files-found: error
          retention-days: 7
