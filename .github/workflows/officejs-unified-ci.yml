name: Office.js unified CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  target-package:
    name: Package ${{ matrix.runtime }} on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            runtime: win-x64
          - runner: macos-15
            runtime: osx-arm64
          - runner: ubuntu-latest
            runtime: linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: officejs/apps/addin/package-lock.json
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Install Office.js dependencies
        working-directory: officejs/apps/addin
        run: npm ci
      - name: Run WPS compatibility regression
        if: ${{ matrix.runtime == 'win-x64' }}
        working-directory: officejs/apps/addin
        shell: pwsh
        run: |
          npm run test:wps
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:wps-tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:wps-dialog
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build unsigned unified artifacts
        shell: pwsh
        run: |
          $origin = if ('${{ matrix.runtime }}' -eq 'linux-x64') {
            'http://127.0.0.1:37421'
          } else {
            'https://localhost:37421'
          }
          ./packaging/package-unified-release.ps1 `
            -Runtime '${{ matrix.runtime }}' `
            -Configuration Release `
            -Version 'test-ci-${{ github.run_number }}-${{ github.run_attempt }}' `
            -ManifestVersion '1.2.${{ github.run_number }}.${{ github.run_attempt }}' `
            -BaseUrl $origin `
            -BridgeUrl $origin `
            -UpdateIndexUrl 'https://updates.wordollama.invalid/ci-${{ github.run_number }}-${{ github.run_attempt }}/index.json' `
            -ExpectedUpdatePublisherSubject 'CN=WordOllama CI Unsigned Test' `
            -OutputRoot ./ci-unified
      - name: Build target-native test installer
        shell: pwsh
        run: |
          $version = 'test-ci-${{ github.run_number }}-${{ github.run_attempt }}'
          if ('${{ matrix.runtime }}' -eq 'win-x64') {
            ./packaging/package-windows-installer.ps1 `
              -ArtifactRoot ./ci-unified/bridge `
              -Version $version `
              -BuildUnsignedForTests
          } elseif ('${{ matrix.runtime }}' -eq 'osx-arm64') {
            ./packaging/package-macos-installer.ps1 `
              -Runtime osx-arm64 `
              -ArtifactRoot ./ci-unified/bridge `
              -Version $version `
              -BuildUnsignedForTests
          } else {
            ./packaging/package-linux-installer.ps1 `
              -Runtime linux-x64 `
              -ArtifactRoot ./ci-unified/bridge `
              -Version $version
          }
      - name: Upload unsigned build evidence
        uses: actions/upload-artifact@v7
        with:
          name: wordollama-js-${{ matrix.runtime }}-unsigned
          path: ci-unified/
          if-no-files-found: error
          retention-days: 7
