name: Office.js Windows signed candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        type: string
      manifest_version:
        description: Four-part Office manifest version
        required: true
        type: string
      update_index_url:
        description: Production HTTPS update-index URL
        required: true
        default: https://downloads.wordollama.com/js/index.json
        type: string

permissions:
  contents: read

jobs:
  windows-signed-candidate:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: officejs/apps/addin/package-lock.json
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Install Office.js dependencies
        working-directory: officejs/apps/addin
        run: npm ci
      - name: Build Windows unsigned source candidate
        shell: pwsh
        run: >
          ./packaging/package-unified-release.ps1
          -Runtime win-x64
          -Configuration Release
          -Version '${{ inputs.version }}'
          -ManifestVersion '${{ inputs.manifest_version }}'
          -BaseUrl https://localhost:37421
          -BridgeUrl https://localhost:37421
          -UpdateIndexUrl '${{ inputs.update_index_url }}'
          -ExpectedUpdatePublisherSubject 'CN=李伯阳'
          -OutputRoot ./signed-candidate
      - name: Import and trust pinned Windows signing certificate
        id: windows-certificate
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          PINNED_INSTALLER_PUBLISHER: CN=李伯阳
          PINNED_SIGNER_THUMBPRINT: D550783D83AF20115E35EBD7391CC08212B79EE4
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:SIGNING_PFX_PASSWORD)) {
            throw "Windows signing secrets are not configured."
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "wordollama-signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
          $password = ConvertTo-SecureString $env:SIGNING_PFX_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfxPath `
            -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if ($null -eq $certificate -or [string]::IsNullOrWhiteSpace($certificate.Thumbprint)) {
            throw "Windows signing certificate import failed."
          }
          if ($certificate.Subject -ne $env:PINNED_INSTALLER_PUBLISHER) {
            throw "Windows signing certificate subject does not match the pinned installer publisher input."
          }
          if ($certificate.Thumbprint -ne $env:PINNED_SIGNER_THUMBPRINT -or
              -not $certificate.HasPrivateKey -or
              $certificate.Subject -ne $certificate.Issuer -or
              $certificate.NotBefore -gt [DateTime]::Now -or
              $certificate.NotAfter -le [DateTime]::Now) {
            throw "Windows signing certificate identity, private key, trust model, or validity period is invalid."
          }
          $codeSigningEku = @($certificate.Extensions |
            Where-Object { $_.Oid.Value -eq '2.5.29.37' } |
            ForEach-Object {
              ([Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]$_).EnhancedKeyUsages |
                Where-Object { $_.Value -eq '1.3.6.1.5.5.7.3.3' }
            })
          if ($codeSigningEku.Count -ne 1) {
            throw "Windows signing certificate is not restricted to the Code Signing EKU."
          }
          $publicCertificatePath = Join-Path $env:RUNNER_TEMP "wordollama-signing.cer"
          Export-Certificate -Cert $certificate -FilePath $publicCertificatePath -Type CERT -Force | Out-Null
          Import-Certificate -FilePath $publicCertificatePath `
            -CertStoreLocation Cert:\CurrentUser\Root | Out-Null
          Import-Certificate -FilePath $publicCertificatePath `
            -CertStoreLocation Cert:\CurrentUser\TrustedPublisher | Out-Null
          "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT
          "publisher_subject=$($certificate.Subject)" >> $env:GITHUB_OUTPUT
      - name: Sign Windows Bridge candidate
        shell: pwsh
        run: >
          ./packaging/sign-bridge-release.ps1
          -Runtime win-x64
          -ArtifactRoot ./signed-candidate/bridge
          -Version '${{ inputs.version }}'
          -WindowsCertificateThumbprint '${{ steps.windows-certificate.outputs.thumbprint }}'
      - name: Build and sign Windows installer
        shell: pwsh
        env:
          PUBLISHER_SUBJECT: ${{ steps.windows-certificate.outputs.publisher_subject }}
        run: |
          ./packaging/package-windows-installer.ps1 `
            -ArtifactRoot ./signed-candidate/bridge `
            -Version '${{ inputs.version }}' `
            -WindowsCertificateThumbprint '${{ steps.windows-certificate.outputs.thumbprint }}' `
            -ExpectedPublisherSubject $env:PUBLISHER_SUBJECT
      - name: Remove temporary signing credentials
        if: ${{ always() }}
        shell: pwsh
        run: |
          $thumbprint = '${{ steps.windows-certificate.outputs.thumbprint }}'
          if (-not [string]::IsNullOrWhiteSpace($thumbprint)) {
            foreach ($store in @('My', 'Root', 'TrustedPublisher')) {
              Remove-Item -LiteralPath "Cert:\CurrentUser\$store\$thumbprint" `
                -Force -ErrorAction SilentlyContinue
            }
          }
          foreach ($name in @("wordollama-signing.pfx", "wordollama-signing.cer")) {
            Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP $name) `
              -Force -ErrorAction SilentlyContinue
          }
      - name: Upload Windows signed candidate and source descriptor
        uses: actions/upload-artifact@v7
        with:
          name: wordollama-js-win-x64-${{ inputs.version }}-signed-candidate
          path: signed-candidate/
          if-no-files-found: error
          retention-days: 14
