name: Office.js signed candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        type: string
      manifest_version:
        description: Four-part Office manifest version
        required: true
        type: string
      addin_origin:
        description: Production Add-in HTTPS origin
        required: true
        type: string
      update_index_url:
        description: Production HTTPS update-index URL
        required: true
        type: string
      windows_installer_publisher:
        description: Exact Windows Authenticode installer certificate subject
        required: true
        type: string
      macos_installer_publisher:
        description: Exact macOS Developer ID Installer authority
        required: true
        type: string

permissions:
  contents: read

jobs:
  signed-candidate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            runtime: win-x64
          - runner: macos-15
            runtime: osx-arm64
          - runner: macos-15-intel
            runtime: osx-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: officejs/apps/addin/package-lock.json
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Install Office.js dependencies
        working-directory: officejs/apps/addin
        run: npm ci
      - name: Build target-native unsigned candidate
        shell: pwsh
        env:
          UPDATE_INSTALLER_PUBLISHER: ${{ matrix.runtime == 'win-x64' && inputs.windows_installer_publisher || inputs.macos_installer_publisher }}
        run: >
          ./packaging/package-unified-release.ps1
          -Runtime ${{ matrix.runtime }}
          -Configuration Release
          -Version '${{ inputs.version }}'
          -ManifestVersion '${{ inputs.manifest_version }}'
          -BaseUrl '${{ inputs.addin_origin }}'
          -BridgeUrl https://127.0.0.1:37421
          -UpdateIndexUrl '${{ inputs.update_index_url }}'
          -ExpectedUpdatePublisherSubject $env:UPDATE_INSTALLER_PUBLISHER
          -OutputRoot ./signed-candidate
      - name: Import Windows signing certificate
        if: ${{ matrix.runtime == 'win-x64' }}
        id: windows-certificate
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          PINNED_INSTALLER_PUBLISHER: ${{ inputs.windows_installer_publisher }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:SIGNING_PFX_PASSWORD)) {
            throw "Windows signing secrets are not configured."
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "wordollama-signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
          $password = ConvertTo-SecureString $env:SIGNING_PFX_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfxPath `
            -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if ($null -eq $certificate -or [string]::IsNullOrWhiteSpace($certificate.Thumbprint)) {
            throw "Windows signing certificate import failed."
          }
          if ($certificate.Subject -ne $env:PINNED_INSTALLER_PUBLISHER) {
            throw "Windows signing certificate subject does not match the pinned installer publisher input."
          }
          "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT
          "publisher_subject=$($certificate.Subject)" >> $env:GITHUB_OUTPUT
      - name: Sign Windows Bridge candidate
        if: ${{ matrix.runtime == 'win-x64' }}
        shell: pwsh
        run: >
          ./packaging/sign-bridge-release.ps1
          -Runtime win-x64
          -ArtifactRoot ./signed-candidate/bridge
          -Version '${{ inputs.version }}'
          -WindowsCertificateThumbprint '${{ steps.windows-certificate.outputs.thumbprint }}'
      - name: Build and sign Windows installer
        if: ${{ matrix.runtime == 'win-x64' }}
        shell: pwsh
        env:
          PUBLISHER_SUBJECT: ${{ steps.windows-certificate.outputs.publisher_subject }}
        run: |
          ./packaging/package-windows-installer.ps1 `
            -ArtifactRoot ./signed-candidate/bridge `
            -Version '${{ inputs.version }}' `
            -WindowsCertificateThumbprint '${{ steps.windows-certificate.outputs.thumbprint }}' `
            -ExpectedPublisherSubject $env:PUBLISHER_SUBJECT
      - name: Import macOS signing identity and notarize
        if: ${{ startsWith(matrix.runtime, 'osx-') }}
        shell: pwsh
        env:
          SIGNING_P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          PINNED_INSTALLER_PUBLISHER: ${{ inputs.macos_installer_publisher }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          foreach ($name in @(
            "SIGNING_P12_BASE64", "SIGNING_P12_PASSWORD", "SIGNING_IDENTITY",
            "INSTALLER_IDENTITY",
            "APPLE_ID", "APPLE_TEAM_ID", "APPLE_APP_PASSWORD"
          )) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "macOS signing secret '$name' is not configured."
            }
          }
          if ($env:INSTALLER_IDENTITY -ne $env:PINNED_INSTALLER_PUBLISHER) {
            throw "macOS installer identity does not match the pinned installer publisher input."
          }
          $p12Path = Join-Path $env:RUNNER_TEMP "wordollama-signing.p12"
          [IO.File]::WriteAllBytes($p12Path, [Convert]::FromBase64String($env:SIGNING_P12_BASE64))
          $keychainPath = Join-Path $env:RUNNER_TEMP "wordollama-signing.keychain-db"
          $keychainPassword = [Guid]::NewGuid().ToString("N")
          Write-Output "::add-mask::$keychainPassword"
          & security create-keychain -p $keychainPassword $keychainPath
          & security set-keychain-settings -lut 21600 $keychainPath
          & security unlock-keychain -p $keychainPassword $keychainPath
          & security import $p12Path -k $keychainPath -P $env:SIGNING_P12_PASSWORD `
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/pkgbuild
          & security set-key-partition-list -S apple-tool:,apple: -s `
            -k $keychainPassword $keychainPath
          & security list-keychains -d user -s $keychainPath
          & xcrun notarytool store-credentials wordollama-ci `
            --apple-id $env:APPLE_ID --team-id $env:APPLE_TEAM_ID `
            --password $env:APPLE_APP_PASSWORD --keychain $keychainPath
          if ($LASTEXITCODE -ne 0) { throw "Unable to configure Apple notarization credentials." }
          ./packaging/sign-bridge-release.ps1 `
            -Runtime '${{ matrix.runtime }}' `
            -ArtifactRoot ./signed-candidate/bridge `
            -Version '${{ inputs.version }}' `
            -MacSigningIdentity $env:SIGNING_IDENTITY `
            -MacNotaryProfile wordollama-ci `
            -MacNotaryKeychain $keychainPath
          ./packaging/package-macos-installer.ps1 `
            -Runtime '${{ matrix.runtime }}' `
            -ArtifactRoot ./signed-candidate/bridge `
            -Version '${{ inputs.version }}' `
            -MacInstallerIdentity $env:INSTALLER_IDENTITY `
            -MacNotaryProfile wordollama-ci `
            -MacNotaryKeychain $keychainPath `
            -BridgeNotarizationEvidencePath `
              "./signed-candidate/bridge/WordOllama-Bridge-${{ inputs.version }}-${{ matrix.runtime }}.notarization.json"
      - name: Verify signed candidate live API
        shell: pwsh
        run: |
          $executable = if ("${{ matrix.runtime }}" -eq "win-x64") {
            "./signed-candidate/bridge/${{ inputs.version }}-${{ matrix.runtime }}/WordOllama.DesktopBridge.exe"
          } else {
            "./signed-candidate/bridge/${{ inputs.version }}-${{ matrix.runtime }}/WordOllama.DesktopBridge"
          }
          ./tools/bridge-live-api-smoke-test.ps1 `
            -Configuration Release -BridgeAssemblyPath $executable
      - name: Remove temporary signing credentials
        if: ${{ always() }}
        shell: pwsh
        run: |
          if ($IsWindows) {
            $thumbprint = '${{ steps.windows-certificate.outputs.thumbprint }}'
            if (-not [string]::IsNullOrWhiteSpace($thumbprint)) {
              Remove-Item -LiteralPath "Cert:\CurrentUser\My\$thumbprint" -Force -ErrorAction SilentlyContinue
            }
            Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP "wordollama-signing.pfx") `
              -Force -ErrorAction SilentlyContinue
          } else {
            $keychainPath = Join-Path $env:RUNNER_TEMP "wordollama-signing.keychain-db"
            & security delete-keychain $keychainPath 2>$null
            Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP "wordollama-signing.p12") `
              -Force -ErrorAction SilentlyContinue
          }
      - name: Upload signed candidate and unsigned source descriptor
        uses: actions/upload-artifact@v7
        with:
          name: wordollama-js-${{ matrix.runtime }}-${{ inputs.version }}-signed-candidate
          path: signed-candidate/
          if-no-files-found: error
          retention-days: 14
